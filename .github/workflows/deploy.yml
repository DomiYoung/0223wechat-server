name: Deploy WeChat Server

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 要部署的 Git 引用（分支、Tag 或提交 SHA）
        required: true
        default: main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Deploy to Server
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASS: ${{ secrets.SERVER_PASS }}
          DEST_PATH: /www/wwwroot/0223wechat-server
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass rsync > /dev/null

          SSH_OPTS="-o StrictHostKeyChecking=no"

          echo "📦 备份当前版本..."
          sshpass -p "$SERVER_PASS" ssh $SSH_OPTS "$SERVER_USER@$SERVER_IP" \
            "cd $DEST_PATH && rm -rf .deploy-backup && mkdir -p .deploy-backup && cp -r dist scripts src package.json package-lock.json tsconfig.json ecosystem.config.cjs .deploy-backup/ 2>/dev/null || true"

          echo "🚀 同步部署文件..."
          sshpass -p "$SERVER_PASS" rsync -az -e "ssh $SSH_OPTS" package.json package-lock.json tsconfig.json ecosystem.config.cjs "$SERVER_USER@$SERVER_IP:$DEST_PATH/"
          sshpass -p "$SERVER_PASS" rsync -az --delete -e "ssh $SSH_OPTS" dist/ "$SERVER_USER@$SERVER_IP:$DEST_PATH/dist/"
          sshpass -p "$SERVER_PASS" rsync -az --delete -e "ssh $SSH_OPTS" scripts/ "$SERVER_USER@$SERVER_IP:$DEST_PATH/scripts/"
          sshpass -p "$SERVER_PASS" rsync -az --delete -e "ssh $SSH_OPTS" src/ "$SERVER_USER@$SERVER_IP:$DEST_PATH/src/"

          echo "📦 安装依赖并执行迁移..."
          sshpass -p "$SERVER_PASS" ssh $SSH_OPTS "$SERVER_USER@$SERVER_IP" \
            "cd $DEST_PATH && npm ci && npm run migrate:all"

          echo "♻️ 重启 PM2..."
          sshpass -p "$SERVER_PASS" ssh $SSH_OPTS "$SERVER_USER@$SERVER_IP" \
            "cd $DEST_PATH && pm2 startOrRestart ecosystem.config.cjs --env production"

          echo "🏥 健康检查..."
          sleep 5
          HEALTH_STATUS=$(sshpass -p "$SERVER_PASS" ssh $SSH_OPTS "$SERVER_USER@$SERVER_IP" \
            "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8199/health --connect-timeout 10")
          if [ "$HEALTH_STATUS" != "200" ]; then
            echo "❌ 健康检查失败 (HTTP $HEALTH_STATUS)，执行回滚..."
            sshpass -p "$SERVER_PASS" ssh $SSH_OPTS "$SERVER_USER@$SERVER_IP" \
              "cd $DEST_PATH && cp -r .deploy-backup/* . && pm2 restart wechat-server"
            exit 1
          fi

          echo "🧹 清理部署备份..."
          sshpass -p "$SERVER_PASS" ssh $SSH_OPTS "$SERVER_USER@$SERVER_IP" \
            "cd $DEST_PATH && rm -rf .deploy-backup"
          echo "✅ 部署完成"
